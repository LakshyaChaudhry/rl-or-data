[project]
name = "rlordata"
version = "0.1.0"
description = "Is it the RL or the data? Matched-budget RFT vs GRPO on procedural counting tasks."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "scipy>=1.12",
  "pandas>=2.2",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
# Local (Mac) ML stack: enough for the hand-written core functions, the 0.6B reference loop, and tests.
ml = [
  "torch>=2.4",
  "transformers>=4.57",
  "peft>=0.13",
  "accelerate>=1.0",
  "datasets>=3.0",
  "safetensors>=0.4",
]
# GPU box additions. TRL pins a supported vLLM range; setup/setup_gpu.sh checks compatibility after install.
gpu = [
  "trl>=1.3",
  "vllm",
  "boto3>=1.34",
  "wandb>=0.17",
]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.5",
  "hypothesis>=6.100",
  "ruff>=0.6",
]
# Optional: Reasoning Gym for the transfer eval. Install from PyPI as `reasoning-gym`.
transfer = ["reasoning-gym"]

[project.scripts]
rlordata = "rlordata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlordata"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "core: tests of hand-written core functions (cases authored by Laksh)",
  "gpu: requires a CUDA GPU",
  "slow: long-running",
]
