    produces: [runs/grpo/grpo_random_reward_s1/eval/final/summary.json]
  - name: eval_grpo_format_only_s1
    cmd: uv run rlordata grpo --config configs/controls/format_only.yaml --seed 1 --stage eval --run-dir runs/grpo/grpo_format_only_s1
    run_dir: runs/grpo/grpo_format_only_s1
