  - name: eval_grpo_random_reward_s1
    cmd: uv run rlordata grpo --config configs/controls/random_reward.yaml --seed 1 --stage eval --run-dir runs/grpo/grpo_random_reward_s1
    run_dir: runs/grpo/grpo_random_reward_s1
