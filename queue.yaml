# tasks/04 §7 default queue for the GRPO box. Order: seed 1 of the H3 pair first (mixed, curated),
# then easy, then the two controls, then seeds 2 and 3, then all evals. Run:
#   uv run python scripts/run_queue.py --queue queue.yaml    (add --dry-run to print only)
# Markers (`produces`) make it idempotent; a killed GRPO job resumes from its latest checkpoint.
jobs:
  - name: train_grpo_mixed_s1
    cmd: uv run rlordata grpo --config configs/grpo/mixed100.yaml --seed 1 --stage train
    run_dir: runs/grpo/grpo_mixed_s1
    resume: true
    requires: [configs/locked/cap.yaml, data/splits/train_curated.jsonl, configs/grpo/mixed100.yaml]
    produces: [runs/grpo/grpo_mixed_s1/budgets.json]
  - name: train_grpo_curated_s1
    cmd: uv run rlordata grpo --config configs/grpo/curated.yaml --seed 1 --stage train
    run_dir: runs/grpo/grpo_curated_s1
    resume: true
    requires: [configs/locked/cap.yaml, data/splits/train_curated.jsonl, configs/grpo/curated.yaml]
    produces: [runs/grpo/grpo_curated_s1/budgets.json]
  - name: train_grpo_easy_s1
    cmd: uv run rlordata grpo --config configs/grpo/easy100.yaml --seed 1 --stage train
    run_dir: runs/grpo/grpo_easy_s1
    resume: true
    requires: [configs/locked/cap.yaml, data/splits/train_curated.jsonl, configs/grpo/easy100.yaml]
    produces: [runs/grpo/grpo_easy_s1/budgets.json]
  - name: train_grpo_random_reward_s1
    cmd: uv run rlordata grpo --config configs/controls/random_reward.yaml --seed 1 --stage train
    run_dir: runs/grpo/grpo_random_reward_s1
    resume: true
    requires: [configs/locked/cap.yaml, data/splits/train_curated.jsonl, configs/controls/random_reward.yaml]
    produces: [runs/grpo/grpo_random_reward_s1/budgets.json]
  - name: train_grpo_format_only_s1
    cmd: uv run rlordata grpo --config configs/controls/format_only.yaml --seed 1 --stage train
    run_dir: runs/grpo/grpo_format_only_s1
    resume: true
    requires: [configs/locked/cap.yaml, data/splits/train_curated.jsonl, configs/controls/format_only.yaml]
    produces: [runs/grpo/grpo_format_only_s1/budgets.json]
  - name: train_grpo_mixed_s2
    cmd: uv run rlordata grpo --config configs/grpo/mixed100.yaml --seed 2 --stage train
    run_dir: runs/grpo/grpo_mixed_s2
    resume: true
    requires: [configs/locked/cap.yaml, data/splits/train_curated.jsonl, configs/grpo/mixed100.yaml]
    produces: [runs/grpo/grpo_mixed_s2/budgets.json]
  - name: train_grpo_curated_s2
    cmd: uv run rlordata grpo --config configs/grpo/curated.yaml --seed 2 --stage train
    run_dir: runs/grpo/grpo_curated_s2
    resume: true
    requires: [configs/locked/cap.yaml, data/splits/train_curated.jsonl, configs/grpo/curated.yaml]
    produces: [runs/grpo/grpo_curated_s2/budgets.json]
  - name: train_grpo_easy_s2
    cmd: uv run rlordata grpo --config configs/grpo/easy100.yaml --seed 2 --stage train
    run_dir: runs/grpo/grpo_easy_s2
    resume: true
    requires: [configs/locked/cap.yaml, data/splits/train_curated.jsonl, configs/grpo/easy100.yaml]
    produces: [runs/grpo/grpo_easy_s2/budgets.json]
  - name: train_grpo_mixed_s3
    cmd: uv run rlordata grpo --config configs/grpo/mixed100.yaml --seed 3 --stage train
    run_dir: runs/grpo/grpo_mixed_s3
    resume: true
