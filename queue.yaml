    produces: [runs/grpo/grpo_easy_s3/budgets.json]
  - name: eval_grpo_mixed_s1
    cmd: uv run rlordata grpo --config configs/grpo/mixed100.yaml --seed 1 --stage eval --run-dir runs/grpo/grpo_mixed_s1
    run_dir: runs/grpo/grpo_mixed_s1
    requires: [runs/grpo/grpo_mixed_s1/budgets.json, configs/locked/transfer.yaml]
    produces: [runs/grpo/grpo_mixed_s1/eval/final/summary.json]
  - name: eval_grpo_curated_s1
