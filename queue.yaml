    produces: [runs/grpo/grpo_curated_s1/eval/final/summary.json]
  - name: eval_grpo_easy_s1
    cmd: uv run rlordata grpo --config configs/grpo/easy100.yaml --seed 1 --stage eval --run-dir runs/grpo/grpo_easy_s1
    run_dir: runs/grpo/grpo_easy_s1
