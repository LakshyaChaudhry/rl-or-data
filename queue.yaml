    produces: [runs/grpo/grpo_mixed_s3/budgets.json]
  - name: train_grpo_curated_s3
    cmd: uv run rlordata grpo --config configs/grpo/curated.yaml --seed 3 --stage train
    run_dir: runs/grpo/grpo_curated_s3
    resume: true
    requires: [configs/locked/cap.yaml, data/splits/train_curated.jsonl, configs/grpo/curated.yaml]
    produces: [runs/grpo/grpo_curated_s3/budgets.json]
  - name: train_grpo_easy_s3
    cmd: uv run rlordata grpo --config configs/grpo/easy100.yaml --seed 3 --stage train
    run_dir: runs/grpo/grpo_easy_s3
    resume: true
